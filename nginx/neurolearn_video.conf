events {
}

http {
    include C:/nginx-1.30.0/conf/mime.types;

    server {
        listen 18080 default_server;
        server_name _;

        # ==============================
        # Next.js frontend
        # ==============================
        location / {
            proxy_pass http://127.0.0.1:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ==============================
        # FastAPI backend
        # ==============================
        location /api/ {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==============================
        # NeuroLearn local videos
        # ==============================
        location /media/ {
            alias D:/GithubRepositories/NeuroLearn_V2/videos/;

            add_header Accept-Ranges bytes always;

            limit_except GET HEAD OPTIONS {
                deny all;
            }

            autoindex off;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;

            sendfile on;
            tcp_nopush on;
            output_buffers 2 512k;

            add_header Cache-Control "public, max-age=3600";
        }

        location = /media {
            return 404;
        }

        # ==============================
        # NeuroLearn-specific logs
        # ==============================
        access_log D:/GithubRepositories/NeuroLearn_V2/nginx/logs/neurolearn_nginx_access.log;
        error_log D:/GithubRepositories/NeuroLearn_V2/nginx/logs/neurolearn_nginx_error.log;
    }
}